<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AB.normal Studios — Movie Poster AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e8e8ef; }
        .font-display { font-family: 'Bebas Neue', sans-serif; }
        .panel { background: #14141c; border: 1px solid #23232f; border-radius: 12px; }
        .poster-frame { aspect-ratio: 2 / 3; background: #0d0d13; border: 1px solid #23232f; border-radius: 8px; overflow: hidden; }
        .poster-frame img { width: 100%; height: 100%; object-fit: contain; }
        select, input, textarea { background: #0d0d13; border: 1px solid #2c2c3a; border-radius: 8px; padding: 8px 10px; width: 100%; color: #e8e8ef; font-size: 14px; }
        select:focus, input:focus, textarea:focus { outline: none; border-color: #6366f1; }
        label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #8b8b9e; display: block; margin-bottom: 6px; }
        .btn { border-radius: 8px; font-weight: 600; transition: all .15s; }
        .btn:disabled { opacity: .45; cursor: not-allowed; }
        .spinner { width: 34px; height: 34px; border: 3px solid #2c2c3a; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; }
        .badge-ok { background: #10281c; color: #4ade80; border: 1px solid #1c4733; }
        .badge-warn { background: #2a2110; color: #fbbf24; border: 1px solid #4a3a16; }
        .badge-info { background: #171733; color: #a5b4fc; border: 1px solid #2c2c58; }
        .thumb { border-radius: 6px; cursor: pointer; border: 1px solid #23232f; transition: border-color .15s; aspect-ratio: 2/3; object-fit: cover; width: 100%; }
        .thumb:hover { border-color: #6366f1; }
    </style>
</head>
<body class="min-h-screen">
    <div class="max-w-6xl mx-auto px-5 py-8">
        <header class="mb-8">
            <h1 class="font-display text-5xl tracking-wide">AB.normal Studios</h1>
            <p class="text-sm text-gray-500 mt-1">Posters for films that never existed.</p>
            <div id="health" class="mt-3 text-xs"></div>
        </header>

        <div class="grid lg:grid-cols-[1fr_340px] gap-6">
            <!-- Poster -->
            <div class="panel p-5">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="font-semibold">Current Poster</h2>
                    <div class="flex gap-2">
                        <button id="save-btn" class="btn px-3 py-1.5 text-sm bg-gray-700 hover:bg-gray-600" disabled>Download</button>
                        <button id="regen-btn" class="btn px-3 py-1.5 text-sm bg-gray-700 hover:bg-gray-600" disabled>Re-render</button>
                    </div>
                </div>

                <div class="poster-frame relative flex items-center justify-center">
                    <div id="loader" class="absolute inset-0 flex flex-col items-center justify-center gap-3 z-10">
                        <div class="spinner"></div>
                        <p id="loading-text" class="text-sm text-gray-400">Ready</p>
                    </div>
                    <img id="poster" class="hidden" alt="Generated movie poster">
                </div>

                <div id="verdict" class="mt-3 hidden"></div>
                <div id="error" class="mt-3 hidden text-sm bg-red-950/50 border border-red-900 text-red-300 rounded-lg p-3"></div>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <!-- Controls -->
            <div class="space-y-4">
                <div class="panel p-5 space-y-4">
                    <h2 class="font-semibold">Controls</h2>

                    <div>
                        <label for="provider">Image Model</label>
                        <select id="provider"></select>
                        <p id="provider-note" class="text-xs text-gray-600 mt-1.5"></p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label for="genre">Genre</label>
                            <select id="genre">
                                <option value="any">Any</option>
                                <option value="Horror">Horror</option>
                                <option value="Sci-Fi">Sci-Fi</option>
                                <option value="fusion">Fusion</option>
                            </select>
                        </div>
                        <div>
                            <label for="era">Era</label>
                            <select id="era">
                                <option value="any">Any</option>
                                <option>1950s</option><option>1960s</option>
                                <option>1970s</option><option>1980s</option>
                                <option>1990s</option><option>2000s</option>
                                <option>2010s</option><option>2020s</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="plot">Premise (optional)</label>
                        <textarea id="plot" rows="2" placeholder="A lighthouse keeper starts receiving his own distress calls…"></textarea>
                    </div>

                    <label class="flex items-center gap-2 cursor-pointer !normal-case !tracking-normal !text-sm !text-gray-300 !mb-0">
                        <input type="checkbox" id="intensity" class="!w-4 !h-4 accent-indigo-500">
                        Darker tone
                    </label>

                    <button id="generate" class="btn w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white">
                        Generate Poster
                    </button>

                    <label class="flex items-center gap-2 cursor-pointer !normal-case !tracking-normal !text-sm !text-gray-300 !mb-0">
                        <input type="checkbox" id="auto" class="!w-4 !h-4 accent-indigo-500">
                        Auto-generate every 60s
                    </label>
                </div>

                <div id="details-panel" class="panel p-5 space-y-3 hidden">
                    <h2 class="font-semibold">The Film</h2>
                    <div id="details" class="space-y-3 text-sm"></div>
                </div>

                <div id="song-panel" class="panel p-5 hidden">
                    <h2 class="font-semibold mb-3">Soundtrack</h2>
                    <div id="song" class="text-sm"></div>
                </div>

                <div id="caption-panel" class="panel p-5 hidden">
                    <div class="flex items-center justify-between mb-3">
                        <h2 class="font-semibold">Instagram</h2>
                        <button id="copy-caption" class="btn px-2.5 py-1 text-xs bg-gray-700 hover:bg-gray-600">Copy</button>
                    </div>
                    <pre id="caption" class="text-xs text-gray-400 whitespace-pre-wrap font-sans"></pre>
                </div>
            </div>
        </div>

        <div id="gallery-panel" class="panel p-5 mt-6 hidden">
            <h2 class="font-semibold mb-4">Recent</h2>
            <div id="gallery" class="grid grid-cols-4 sm:grid-cols-6 lg:grid-cols-8 gap-3"></div>
        </div>
    </div>

<script>
const API = window.location.origin;

// ---------------------------------------------------------------------------
// Credits block. This is the ONLY thing we composite.
//
// The title and tagline are painted into the artwork by the image model, in
// period-correct lettering. A billing block is 6pt condensed type that no image
// model renders reliably — and it's also the one piece where "correct spelling
// in a boring font" is the entire requirement. So it's the one piece we draw.
// ---------------------------------------------------------------------------
function compose(img, credits) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const { width: w, height: h } = canvas;

    ctx.drawImage(img, 0, 0, w, h);

    // Scrim only under the credits, so the artwork isn't dimmed.
    const scrim = ctx.createLinearGradient(0, h * 0.80, 0, h);
    scrim.addColorStop(0, 'rgba(0,0,0,0)');
    scrim.addColorStop(1, 'rgba(0,0,0,0.72)');
    ctx.fillStyle = scrim;
    ctx.fillRect(0, h * 0.80, w, h * 0.20);

    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.92)';

    // Scale and tracking come from the concept's billing style, so a 1950s
    // poster gets a few large, airy names and a 2010s one gets a block of fine
    // print. Drawing the same block for every decade would be the same
    // anachronism as using the same font for every decade.
    const unit = (w / 100) * (credits.scale ?? 1);
    const present = [
        credits.studio && { text: credits.studio, size: unit * 1.9, tracking: 0.22 },
        credits.cast && { text: credits.cast, size: unit * 2.5, tracking: credits.tracking ?? 0.10 },
        credits.director && { text: credits.director, size: unit * 1.9, tracking: 0.18 }
    ].filter(Boolean);

    // Centre the block in the lower band regardless of how many lines it has.
    const lead = unit * 3.8;
    const top = h * 0.945 - ((present.length - 1) * lead) / 2;

    present.forEach((line, i) => {
        let size = line.size;
        ctx.font = `600 ${size}px 'Archivo Narrow', sans-serif`;
        // Condense until it fits, the way a real billing block does.
        while (ctx.measureText(line.text).width > w * 0.86 && size > unit * 0.6) {
            size -= 0.5;
            ctx.font = `600 ${size}px 'Archivo Narrow', sans-serif`;
        }
        drawTracked(ctx, line.text, w / 2, top + i * lead, size * line.tracking);
    });

    return canvas.toDataURL('image/png');
}

// Canvas has no letter-spacing, and billing blocks live on tracking.
function drawTracked(ctx, text, cx, y, tracking) {
    const chars = [...text];
    const width = chars.reduce((sum, c) => sum + ctx.measureText(c).width + tracking, 0) - tracking;
    let x = cx - width / 2;
    for (const c of chars) {
        ctx.fillText(c, x + ctx.measureText(c).width / 2, y);
        x += ctx.measureText(c).width + tracking;
    }
}

// ---------------------------------------------------------------------------

async function post(path, body) {
    const res = await fetch(`${API}/api/${path}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.success) {
        throw new Error(data.error || `${path} failed (${res.status})`);
    }
    return data;
}

const el = (id) => document.getElementById(id);
const state = { busy: false, concept: null, poster: null, recent: [], timer: null };

function status(text) {
    el('loading-text').textContent = text;
}

function showError(message) {
    el('error').textContent = message;
    el('error').classList.remove('hidden');
}

async function loadHealth() {
    try {
        const res = await fetch(`${API}/api/health`);
        const data = await res.json();

        const select = el('provider');
        select.innerHTML = '';
        for (const p of data.image.providers) {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.configured ? p.label : `${p.label} — no API key`;
            opt.disabled = !p.configured;
            opt.selected = p.id === data.image.default && p.configured;
            select.appendChild(opt);
        }
        if (!select.value) {
            const first = data.image.providers.find((p) => p.configured);
            if (first) select.value = first.id;
        }
        describeProvider(data.image.providers);
        select.onchange = () => describeProvider(data.image.providers);

        if (data.status !== 'ok') {
            el('health').innerHTML = `<span class="badge badge-warn">Missing: ${data.missing.join(', ')}</span>`;
            el('generate').disabled = true;
        } else {
            el('health').innerHTML = `<span class="badge badge-ok">Ready · ${data.text.model}</span>`;
        }
    } catch {
        el('health').innerHTML = '<span class="badge badge-warn">Backend unreachable</span>';
        el('generate').disabled = true;
    }
}

function describeProvider(providers) {
    const p = providers.find((x) => x.id === el('provider').value);
    if (!p) return;
    const bits = [`~$${p.approxCostUsd.toFixed(3)} per poster`];
    if (p.supportsMaskEdit) bits.push('can repair a bad title in place');
    if (p.supportsReferenceImages) bits.push('takes reference images');
    el('provider-note').textContent = bits.join(' · ');
}

async function generate() {
    if (state.busy) return;
    state.busy = true;
    el('generate').disabled = true;
    el('regen-btn').disabled = true;
    el('save-btn').disabled = true;
    el('error').classList.add('hidden');
    el('verdict').classList.add('hidden');
    el('poster').classList.add('hidden');
    el('loader').classList.remove('hidden');

    try {
        status('Writing the film…');
        const { concept, credits } = await post('generate-concept', {
            genre: el('genre').value,
            era: el('era').value,
            plot: el('plot').value.trim(),
            intensity: el('intensity').checked ? 'hardcore' : 'normal',
            avoidTitles: state.recent.map((r) => r.title)
        });
        state.concept = concept;
        renderDetails(concept);

        status('Painting the poster…');
        const image = await post('generate-image', {
            concept,
            provider: el('provider').value
        });

        status('Setting the credits…');
        const composed = await composeAsync(image.imageUrl, credits);
        state.poster = composed;
        el('poster').src = composed;
        el('poster').classList.remove('hidden');
        el('loader').classList.add('hidden');
        el('save-btn').disabled = false;
        el('regen-btn').disabled = false;

        addToGallery(concept, composed);
        renderCaption(concept);

        // Fire-and-forget: neither of these should block the poster appearing.
        verify(image.imageUrl, concept, image);
        loadSong(concept);
    } catch (error) {
        el('loader').classList.add('hidden');
        showError(error.message);
    } finally {
        state.busy = false;
        el('generate').disabled = false;
    }
}

function composeAsync(imageUrl, credits) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
            document.fonts.ready.then(() => resolve(compose(img, credits)));
        };
        img.onerror = () => reject(new Error('Could not load the generated image'));
        img.src = imageUrl;
    });
}

// The closed loop: we know exactly what the title was supposed to say, so we can
// check whether the model actually said it.
async function verify(imageUrl, concept, image) {
    el('verdict').classList.remove('hidden');
    el('verdict').innerHTML = `<span class="badge badge-info">${image.model} · proofreading…</span>`;

    try {
        const { verdict } = await post('verify-poster', {
            imageUrl,
            expectedTitle: concept.title,
            expectedTagline: concept.tagline
        });

        const clean = verdict.title_correct && verdict.legible && !verdict.stray_text;
        const badges = [`<span class="badge badge-info">${image.model}</span>`];

        if (clean) {
            badges.push('<span class="badge badge-ok">Title renders correctly</span>');
        } else {
            if (!verdict.title_correct) {
                badges.push(`<span class="badge badge-warn">Reads &ldquo;${escapeHtml(verdict.title_as_rendered || 'nothing')}&rdquo;, wanted &ldquo;${escapeHtml(concept.title)}&rdquo;</span>`);
            }
            if (verdict.stray_text) badges.push('<span class="badge badge-warn">Stray text</span>');
            if (!verdict.legible) badges.push('<span class="badge badge-warn">Title not legible</span>');
        }

        el('verdict').innerHTML = badges.join(' ') +
            (verdict.issues?.length && !clean
                ? `<p class="text-xs text-gray-500 mt-2">${verdict.issues.map(escapeHtml).join(' · ')}</p>`
                : '');
    } catch (error) {
        el('verdict').innerHTML = `<span class="badge badge-warn">Proofread failed: ${escapeHtml(error.message)}</span>`;
    }
}

async function loadSong(concept) {
    el('song-panel').classList.remove('hidden');
    el('song').innerHTML = '<p class="text-gray-600 text-xs">Picking a needle drop…</p>';
    try {
        const { recommendation: s } = await post('generate-song', { concept });
        el('song').innerHTML = `
            <p class="font-medium">${escapeHtml(s.title)}</p>
            <p class="text-gray-500">${escapeHtml(s.artist)} · ${escapeHtml(s.year)}</p>
            <p class="text-gray-400 text-xs mt-2 leading-relaxed">${escapeHtml(s.reason)}</p>`;
    } catch (error) {
        el('song').innerHTML = `<p class="text-xs text-red-400">${escapeHtml(error.message)}</p>`;
    }
}

function renderDetails(c) {
    el('details-panel').classList.remove('hidden');
    const row = (label, value) =>
        `<div><p class="text-[11px] uppercase tracking-wider text-gray-600">${label}</p><p>${escapeHtml(value)}</p></div>`;
    el('details').innerHTML = [
        row('Title', c.title),
        row('Tagline', c.tagline),
        row('Era / Genre', `${c.decade} · ${c.genre}`),
        row('Synopsis', c.synopsis),
        row('Cast', (c.cast || []).join(', ')),
        row('Directed by', c.director),
        row('Studio', c.studio),
        row('Medium', c.art_direction.medium)
    ].join('');
}

function renderCaption(c) {
    el('caption-panel').classList.remove('hidden');
    const tags = ['#AIart', '#movieposter', '#fakemovie', `#${c.decade}`,
        `#${c.genre.toLowerCase().replace(/[^a-z]/g, '')}`, '#ABnormalStudios'];
    el('caption').textContent =
        `${c.title.toUpperCase()} (${c.decade})\n"${c.tagline}"\n\n${c.synopsis}\n\n` +
        `Dir. ${c.director} · ${(c.cast || []).slice(0, 3).join(', ')}\n\n${tags.join(' ')}`;
}

function addToGallery(concept, dataUrl) {
    state.recent.unshift({ title: concept.title, concept, dataUrl });
    state.recent = state.recent.slice(0, 16);
    el('gallery-panel').classList.remove('hidden');
    el('gallery').innerHTML = '';
    state.recent.forEach((item, i) => {
        const img = document.createElement('img');
        img.src = item.dataUrl;
        img.className = 'thumb';
        img.title = item.title;
        img.onclick = () => {
            el('poster').src = item.dataUrl;
            state.poster = item.dataUrl;
            state.concept = item.concept;
            renderDetails(item.concept);
            renderCaption(item.concept);
            el('verdict').classList.add('hidden');
        };
        el('gallery').appendChild(img);
    });
}

function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = String(s ?? '');
    return div.innerHTML;
}

// Events
el('generate').onclick = generate;
el('regen-btn').onclick = generate;

el('save-btn').onclick = () => {
    if (!state.poster) return;
    const a = document.createElement('a');
    a.href = state.poster;
    a.download = `${(state.concept?.title || 'poster').replace(/\s+/g, '-').toLowerCase()}.png`;
    a.click();
};

el('copy-caption').onclick = async () => {
    await navigator.clipboard.writeText(el('caption').textContent);
    el('copy-caption').textContent = 'Copied';
    setTimeout(() => { el('copy-caption').textContent = 'Copy'; }, 1500);
};

el('auto').onchange = (e) => {
    clearInterval(state.timer);
    if (e.target.checked) state.timer = setInterval(() => { if (!state.busy) generate(); }, 60000);
};

loadHealth();
</script>
</body>
</html>
